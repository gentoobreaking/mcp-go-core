name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
        profile: [minimal, standard, full]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build (profile: ${{ matrix.profile }})
        run: |
          go build -ldflags="-X main.version=${{ github.sha }}" ./...
          
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 ./...

      - name: Run benchmarks
        run: |
          go test -bench=. -benchtime=1s -count=1 ./benchmarks/... || true

      - name: Run CI tests (specific profile)
        run: go test -v -count=1 ./tests/ci/...

      - name: Run smoke tests
        run: go test -v -count=1 ./tests/smoke/...

      - name: Run negative tests
        run: go test -v -count=1 ./tests/negative/...

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install mcp-go-core
        run: |
          go build -o dist/mcp-go-core ./cmd/mcp-go-core
          sudo cp dist/mcp-go-core /usr/local/bin/

      - name: Run verification
        run: |
          mcp-go-core verify --binary dist/mcp-go-core

      - name: Check binary for feature compliance
        run: |
          mcp-go-core --version

  regression:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run regression tests
        run: go test -v -count=1 -run "Test.*Regression" ./tests/ci/...

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, verify, regression]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build release binary
        run: |
          go build -ldflags="-s -w -trimpath" -o dist/mcp-go-core ./cmd/mcp-go-core

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-go-core
          path: dist/
